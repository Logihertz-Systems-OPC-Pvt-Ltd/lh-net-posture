[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-net-posture"
version = "0.1.0"
description = "Asynchronous local and edge-node network exposure auditor by Logihertz Systems OPC Pvt Ltd"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Logihertz Systems OPC Pvt Ltd" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]

[project.scripts]
lh-net = "lh_net_posture.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_net_posture"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "W291"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=lh_net_posture --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
