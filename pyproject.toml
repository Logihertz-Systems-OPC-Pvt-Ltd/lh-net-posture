[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-net-posture"
version = "0.1.0"
description = "Inspects listening socket tables (ss/netstat), routing tables, ARP caches, VLAN trunks, and network interface configurations to flag cleartext protocols (Telnet/FTP), 0.0.0.0 management bindings, and IP forwarding risks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-net-posture"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-net-posture"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-net-posture#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-net-posture/issues"

[project.scripts]
lh-net = "lh_net_posture.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_net_posture"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "W291"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=lh_net_posture --cov-report=term-missing"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
